{% extends "base.html" %}
{% block title %}Delete Profile{% endblock %}

{% block content %}
<div class="delete-profile-container" style="max-width: 600px; margin: auto; padding: 2rem; background: #fff0f5; border-radius: 1rem; text-align: center;">
    <h2 style="color: #d62839;">Are you sure you want to delete your profile?</h2>
    <p>This action is permanent and cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background-color: #d62839; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 0.5rem;">Yes, Delete My Profile</button>
        <a href="{% url 'dashboard' %}" style="margin-left: 1rem; color: #555;">Cancel</a>
    </form>
</div>
{% endblock %}
